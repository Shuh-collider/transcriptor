[project]
name = "transcriptor"
version = "0.1.0"
description = "Локальный транскриптор YouTube: GigaAM v3 / Qwen3-ASR + pyannote + Claude"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # PyTorch с CUDA. Связка 2.10 / torchcodec 0.10 / pyannote 4.0 проверена авторами GigaAM
    "torch==2.10.*",
    "torchaudio==2.10.*",
    "torchcodec==0.10.*",
    # Распознавание речи
    "gigaam",
    "transformers>=5.10",
    "accelerate>=1.1",
    "silero-vad>=6.2",
    # Кто говорит
    "pyannote.audio>=4.0.7,<4.1",
    # YouTube: yt-dlp + Deno (JS-движок для обхода защиты плеера) + ffmpeg
    "yt-dlp[default,deno]>=2026.8.19",
    "imageio-ffmpeg>=0.6",
    # Пересказ и главы: Gemini или Claude
    "google-genai>=2.25.0",
    "anthropic>=1.8",
    # Веб-интерфейс
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "python-dotenv>=1.1",
    # Проверка HTTPS через хранилище сертификатов Windows (антивирусы и прокси подменяют сертификаты)
    "truststore>=0.10",
    "numpy>=2",
    "soundfile>=0.13",
    "mcp[cli]>=2.2.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
gigaam = { git = "https://github.com/salute-developers/GigaAM" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
